{% load static %}
{% for reihe in reihen %}
  <div class="grid">
    {% for spalte in reihe %}
      <div class="s12 {{ spalte.breite }}">
        {% for p in spalte.bilder %}
          <article class="{{ p.hoehe }} no-padding hover-info" tabindex="0">
            <img class="responsive" src="{{ MEDIA_URL }}{{ p.bild }}" alt="{{ p.titel }}">
            <div class="card fill blur medium-padding hover-info-card">
              <h6>{{ p.titel }}</h6>
              <p>{{ p.text }}</p>
            </div>
          </article>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
{% endfor %}
